name: Upload Image to Docker Hub & Deploy to Dev

on:
  push:
    branches:
      - develop

jobs:
  docker:
    if: (github.event_name == 'push' ) || (github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Load env from file
        run: |
          echo "Loading env vars from .env file"
          while IFS='=' read -r key value
          do
            key=$(echo $key | tr '.' '_')
            echo "$key=$value" >> $GITHUB_ENV
            echo "$key=$value"
          done < conf/.env.CI.dev
          echo "Done"
      
      - name: Setup git-crypt
        run: | 
          sudo apt-get update
          sudo apt-get install -y git-crypt
      
      - name: Decrypt secrets
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          echo "$GIT_CRYPT_KEY" | base64 --decode > git_crypt.key
          git-crypt unlock git_crypt.key
          rm git_crypt.key
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Build
        run: |
          npx ng build --configuration production
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-docker-
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: itacademybcn/itachallenges:itachallenge-nginx-${{ env.MICROSERVICE_VERSION }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
  
  deploy:
    if: (github.event_name == 'push' ) || (github.event.pull_request.merged == true)
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Load env from file
        run: |
          echo "Loading env vars from .env file"
          while IFS='=' read -r key value
          do
            key=$(echo $key | tr '.' '_')
            echo "$key=$value" >> $GITHUB_ENV
            echo "$key=$value"
          done < conf/.env.CI.dev
          echo "Done"
      
      - name: Execute SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST_URL }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            ./deploy_frontend_dev.sh itachallenge-nginx ${{ env.MICROSERVICE_VERSION }}
