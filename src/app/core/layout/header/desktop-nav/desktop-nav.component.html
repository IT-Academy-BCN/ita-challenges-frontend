<div class="desktop-nav">
  <!-- registerUsers -->
  @if(isLoggedIn && currentRole==='ADMIN'){
    <button class="login" (click)="openRegisterUsersModal()">
      {{'modules.challenge.header.buttonRegisterUsers' | translate}}
    </button>
  }

  <!-- languageSelect -->
  <div>
    <label for="languageSelect">
      <select class="languageSelect" id="languageSelect" (change)="changeLanguage($event)" [style.width]="navService.selectWidth">
        <option value="ca">CAT</option>
        <option value="es">ES</option>
        <option value="en">EN</option>
      </select>
    </label>
  </div>

  <!-- Login -->
  @if(isLoggedIn){
    <div class="user-container">
      <button [ngClass]="{'user':true, 'userWithPhoto':userPhoto !=''}" (click)="toggleDropdown()">
        <img [src]="userPhoto ? userPhoto : 'assets/img/icon/user.svg'" [alt]="'components.header.userPhoto' | translate" [ngClass]="{'img-fluid': userPhoto !=''}">
      </button>
      <div class="dropdown" [ngClass]="{ 'show': dropdownOpen }">
          <a>{{user}}</a>
          <a>
            <app-toggle [currentRole]="currentRole" (roleSwiched)="onSwitchRole($event)"></app-toggle>
          </a>
          <a (click)="logout()">{{'modules.challenge.header.logout' | translate}}<img src="assets/img/icon/logout.svg" alt="logout" style="height: 17px;"></a>
      </div>
    </div>
  } @else {
    <button class="login" data-bs-toggle="modal" data-bs-target="#mentorLoginModal">
      {{'modules.challenge.header.login' | translate}}
    </button>
  }
</div>
