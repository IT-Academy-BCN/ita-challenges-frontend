<div class="d-flex flex-row" [formGroup]="languageForm">
  <div *ngFor="let language of languages" class="d-flex flex-row ms-3">
    <input 
      class="form-check-input"
      type="checkbox" 
      [id]="language.id_language" 
      [formControlName]="language.language_name.toLowerCase()"
      [value]="language.id_language"
    />
    <label class="form-check-label"  [for]="language.id_language">
      {{ language.language_name }}
    </label>
  </div>
</div>
