<div class="starter">
  <!-- OLD FILTERS COMPONENT -->
  <header class="challenges-header">
    <div class="d-flex justify-content-between align-items-center challenges-filter-header">
      <h2>{{ "modules.starter.main.section2.title" | translate }}</h2>
      <div class="d-flex gap-2 align-items-center">
        <!-- MOBILE FILTER BUTTON -->
        <!-- TODO: Decide how this button fits with the new filters implementations,
        will the button be the same for the mobile and desktop versions? -->
        <button class="btn btn-outline-primary btnFiltrar d-xl-none" (click)="openModal()">
          <strong>Filtrar</strong>
        </button>
        <!-- NEW CHALLENGE BUTTON -->
        <button [routerLink]="['/ita-challenge/challenges/new-challenge']" *ngIf="isAdmin" class="btn btn-sm btn-primary new-challenge-btn">
          {{ "components.mainMenu.section4.title" | translate }}
        </button>
      </div>
    </div>
    <fieldset id="filters-container">
      <!-- SORT BY AND FILTERS SELECTOR -->
      <div id="filters-selector">
        <!-- ORDER BY SELECTOR -->
          <!-- SORT BY -->
    <app-sort-select
      [sortBy]="sortBy"
      [isAscending]="isAscending"
      (sortSelected)="changeSort($event)"
      (orderSelected)="changeOrder($event)">
    </app-sort-select>
        <!-- FILTERS SELECTOR -->
        <div id="filters-panel" class="filters-panel open">
          <app-starter-filters (filtersSelected)="getChallengeFilters($event)"></app-starter-filters>
        </div>
      </div>
    </fieldset>
  </header>


  <!-- NEW FILTERS COMPONENT -->
  <header id="challenge-filters">
    <app-challenge-list-filters
      (sortSelected)="changeSort($event)"
      (orderSelected)="changeOrder($event)"
      [initialFilters]="filters"
      (filtersApplied)="onModalFiltersApplied($event)">
    </app-challenge-list-filters>
  </header>
  
  
  <main id="challenges-container" class="col-12 col-xl-8">

    <div id="challenges" #challenge>
      <ng-container *ngIf="(challenges?.length || 0) > 0; else noResultsTpl">
        <app-challenge-card
          *ngFor="let challenge of challenges; let i = index"
          [title]="challenge.challenge_title | dynamicTranslate"
          [description]="challenge.detail.description | dynamicTranslate"
          [languages]="challenge.languages"
          [creation_date]="challenge.creation_date"
          [level]="challenge.level"
          [popularity]="challenge.popularity"
          [id]="challenge.id_challenge"
          [favorites_count]="challenge.timesFavorite || 0"
          [challenge_timesSolved]="challenge.timesSolved || timesSolved"
          [isFavorite]="isFavoriteChallenge(challenge.id_challenge)"
          [isBookmarked]="isBookmarkedChallenge(challenge.id_challenge)"
          [solutionStatus]="solutionStatusMap[challenge.id_challenge]"
          [tagIds]="challenge.tags"
        >
        </app-challenge-card>
      </ng-container>
    </div>

    <ng-template #noResultsTpl>
      <div class="text-center py-5">
        <p class="h5 text-muted">
          {{ 'modules.starter.empty.noResults' | translate }}
        </p>
      </div>
    </ng-template>
  </main>
</div>
  
 <app-filters-modal #modal  (filtersSelected)="getChallengeFilters($event)"></app-filters-modal>
