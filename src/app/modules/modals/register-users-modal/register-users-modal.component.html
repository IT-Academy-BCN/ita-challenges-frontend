<div class="modal-header align-items-center justify-content-end pb-0">
    <div class="close" data-bs-dismiss="modal" aria-label="Close">
        <span></span>
        <span></span>
    </div>
</div>
<div class="d-flex flex-column justify-content-center">
    <div class="modal-body d-flex flex-column gap-2 pt-0 col-10 mx-auto text-center">
        <h2 class="modal-title">Añadir alumnos/as</h2>
        <p class="d-flex align-items-start">Inserta los usuarios de github</p>
        <form (ngSubmit)="addUsername()" class="d-flex flex-column gap-2 justify-content-center">
            <div class="d-flex gap-2 align-items-center">
                <input type="text" class="form-control" [(ngModel)]="username" name="username"
                    placeholder="Usuario de GitHub" required pattern="^(?!-)(?!.*--)[a-zA-Z0-9-]{1,39}(?<!-)$"
                    #usernameInput="ngModel">
                <button type="submit" class="btn btn-primary" [disabled]="usernameInput.invalid || isDuplicateUsername(username)">Añadir</button>
            </div>
            <div class="d-flex align-items-start">
                <div *ngIf="usernameInput.invalid && (usernameInput.dirty || usernameInput.touched) && username"
                    class="text-danger small my-2">
                    <div *ngIf="usernameInput.errors?.['pattern']">Nombre de suario no válido.</div>
                </div>
                <div *ngIf="isDuplicateUsername(username) && usernameInput.valid" class="text-danger small my-2">
                    Este usuario ya ha sido añadido.
                </div>
            </div>
        </form>
        <div *ngIf="usernames.length > 0" class="my-1">
            <div class="list-group">
        <div class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let user of usernames; let i = index">
                    {{ user }}
                </div>
            </div>
        </div>
    </div>
    <div class="col-12 modal-footer gap-2 mb-3 text-center d-flex flex-column">
        <button type="button" class="btn btn-primary col-4" data-bs-dismiss="modal">Confirmar</button>
    </div>
</div>
