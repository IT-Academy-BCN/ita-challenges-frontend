  <div class="row w-100">
  <div class="col-12 col-md-8">
    <p>
       <a class="link" (click)="onCancel()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M10.7672 7.5431C11.0672 7.25744 11.0788 6.78271 10.7931 6.48276C10.5074 6.18281 10.0327 6.17123 9.73276 6.4569L10.7672 7.5431ZM4.48276 11.4569C4.18281 11.7426 4.17123 12.2173 4.4569 12.5172C4.74256 12.8172 5.21729 12.8288 5.51724 12.5431L4.48276 11.4569ZM5.51724 11.4569C5.21729 11.1712 4.74256 11.1828 4.4569 11.4828C4.17123 11.7827 4.18281 12.2574 4.48276 12.5431L5.51724 11.4569ZM9.73276 17.5431C10.0327 17.8288 10.5074 17.8172 10.7931 17.5172C11.0788 17.2173 11.0672 16.7426 10.7672 16.4569L9.73276 17.5431ZM5 11.25C4.58579 11.25 4.25 11.5858 4.25 12C4.25 12.4142 4.58579 12.75 5 12.75V11.25ZM19 12.75C19.4142 12.75 19.75 12.4142 19.75 12C19.75 11.5858 19.4142 11.25 19 11.25V12.75ZM9.73276 6.4569L4.48276 11.4569L5.51724 12.5431L10.7672 7.5431L9.73276 6.4569ZM4.48276 12.5431L9.73276 17.5431L10.7672 16.4569L5.51724 11.4569L4.48276 12.5431ZM5 12.75H19V11.25H5V12.75Z" fill="currentColor"/>
              </svg>
              <span class="backTo">{{ "modules.challenge.backTo" | translate }}</span>
          </a>
    </p>
    <div class="d-flex align-items-start">
      <div class="difficulty">
        <div class="difficulty d-flex" *ngIf="level == 'EASY'">
          <img src="assets/img/icon/difficulty-on.svg" alt="Difficulty">
          <img src="assets/img/icon/difficulty-off.svg" alt="Difficulty">
          <img src="assets/img/icon/difficulty-off.svg" alt="Difficulty">
        </div>
        <div class="difficulty d-flex" *ngIf="level == 'MEDIUM'">
          <img src="assets/img/icon/difficulty-on.svg" alt="Difficulty">
          <img src="assets/img/icon/difficulty-on.svg" alt="Difficulty">
          <img src="assets/img/icon/difficulty-off.svg" alt="Difficulty">
        </div>
        <div class="difficulty d-flex" *ngIf="level == 'HARD'">
          <img src="assets/img/icon/difficulty-on.svg" alt="Difficulty">
          <img src="assets/img/icon/difficulty-on.svg" alt="Difficulty">
          <img src="assets/img/icon/difficulty-on.svg" alt="Difficulty">
        </div>
      </div>
      <div class="title">
        <h3 class="ms-2">{{title | dynamicTranslate}}</h3>
      </div>
    </div>
    <div class="stats" *ngIf="!challengeStarted">
      <span class="stat" [ngbTooltip]="'tooltips.startedFinished' | translate">
        <img src="assets/img/icon/times-performed.svg" alt="Times performed">
        <span>{{timesSolved}}</span>
      </span>
      <span class="stat" [ngbTooltip]="'tooltips.favorites' | translate" (click)="toggleFavorite()" style="cursor: pointer;">
        <img *ngIf="!isFavorite" src="assets/img/icon/heart.svg" alt="Add to favorites">
        <img *ngIf="isFavorite" src="assets/img/icon/heart-filled.svg" alt="Remove from favorites">
        <span>{{favorites_count}}</span>
      </span>
      <span class="stat" *ngIf="creation_date" [ngbTooltip]="'tooltips.creationDate' | translate">
        <img src="assets/img/icon/date.svg" alt="Date">
        {{ creation_date | customDate }}
      </span>
      <span class="stat" [ngbTooltip]="isBookmarked ? ('tooltips.bookmarks.saved' | translate) : ('tooltips.bookmarks.unsaved' | translate)" (click)="toggleBookmark($event)" (keydown.enter)="toggleBookmark($event)" [attr.aria-pressed]="isBookmarked" [attr.aria-label]="isBookmarked ? ('tooltips.bookmarks.saved' | translate) : ('tooltips.bookmarks.unsaved' | translate)">
        <img *ngIf="!isBookmarked" src="assets/img/icon/bookmark.svg" [attr.alt]="'tooltips.bookmarks.unsaved' | translate">
        <img *ngIf=" isBookmarked" src="assets/img/icon/bookmark-filled.svg" [attr.alt]="'tooltips.bookmarks.saved' | translate">
      </span>
    </div>
  </div>

  <div class="col-md-4 button d-none d-md-flex">
    <ng-container *ngIf="!solutionSent; else solutionSentMessage">
  <button
  *ngIf="!challengeStarted && userRole !== USER_ROLE.ADMIN" class="btn btn-sm btn-primary" (click)="onStartChallenge()" >
  {{ 'modules.challenge.header.buttonStart' | translate }}</button>
      <button *ngIf="challengeStarted"  class="btn btn-sm btn-primary" (click)="saveChallenge()">{{'modules.challenge.header.buttonSaveChallenge' | translate }}</button>
      <button *ngIf="challengeStarted"  class="btn btn-sm btn-primary" (click)="openSendSolutionModal()"> {{'modules.challenge.header.buttonSendSolution' | translate }}</button>
    </ng-container>
    <ng-container *ngIf="userRole === USER_ROLE.ADMIN">
        <button class="btn btn-sm btn-primary"> {{ 'modules.challenge.header.buttonEditChallenge' | translate }}</button>  
    </ng-container>
    
    <!-- Si ya se envió la solución -->
     <ng-template #solutionSentMessage>
       <div *ngIf="userRole === USER_ROLE.USER" class="d-none d-md-flex align-items-center gap-2 solutionSent">
         <p>{{'modules.challenge.header.solutionSend' | translate }}</p>
         <img src="assets/img/icon/tick-pink.svg" alt="tick icon">
       </div>
     </ng-template>

  </div>
  
</div>
