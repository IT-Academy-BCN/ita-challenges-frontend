<div class="challenge-component" *ngIf="challenge">
    <p>
       <a class="link back-link" (click)="onCancel()">
            <img class="arrow-left" src="assets/img/icon/arrow_left.svg" alt="arrow-left">{{ "modules.challenge.backTo" | translate }}
        </a>
    </p>

    <app-challenge-header
        [title]="title"
        [creation_date]="creation_date"
        [level]="level"
        [activeId]="activeId"
        [idChallenge]="idChallenge"
        [favorites_count]="challenge.timesFavorite || 0"
        [timesSolved]="challenge.timesSolved"
        (startChallenge)="onStartChallenge($event)"
        (favoritesUpdated)="onFavoritesUpdated($event)"
        [isFavorite]="isFavoriteChallenge(challenge.id_challenge)"
        [isBookmarked]="isBookmarkedChallenge(challenge.id_challenge)"
        [languageId]="languageId"
        (solutionStatusChanged)="onSolutionStatusChanged($event)"
        [solutionText]="solutionText"
>   </app-challenge-header>

    <app-challenge-info
        [detail]="detail"
        [description]="description"
        [popularity]="popularity"
        [languages]="languages"
        [activeId]="activeId"
        (activeIdChange)="onActiveIdChange($event)"
        [idChallenge]="idChallenge"
        [startChallenge]="challengeStarted"
        [isEditorChallengeVisible]="isEditorChallengeVisible"
        [startChallenge]="challengeStarted"
        (activeIdChange)="onActiveIdChange($event)"
        (solutionChanged)="onEditorSolutionChanged($event)"
        [userSolutionStatus]="solutionState"
>   </app-challenge-info>

</div>
