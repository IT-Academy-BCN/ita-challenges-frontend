<div class="container mt-4">
  <div class="card">
    <div class="card-body">
      <h3>Nuevo reto</h3>

      <form #challengeForm="ngForm" (ngSubmit)="onSubmit()">
        <!-- Título -->
        <div class="form-group mb-4">
          <label for="title" class="form-label">Título</label>
          <input 
            type="text" 
            class="form-control" 
            id="title" 
            name="challengeTitle"
            [(ngModel)]="challenge.challengeTitle" 
            required
          >
        </div>

        <!-- Enunciado -->
        <div class="form-group mb-4">
          <label for="description" class="form-label">Enunciado</label>
          <div class="editor-container">
            <editor
              [(ngModel)]="challenge.description"
              name="description"
              [init]="editorConfig"
              required
            ></editor>
          </div>
        </div>

<!-- Dificultad -->
<div class="form-group mb-4">
  <label class="form-label">Dificultad</label>
  <div class="difficulty-group">
    <!-- Fácil -->
    <div class="difficulty-option">
      <input 
        type="radio" 
        class="form-check-input" 
        id="easy" 
        name="level" 
        value="EASY"
        [(ngModel)]="challenge.level">
      <label class="difficulty-label" for="easy">
        <div class="radio-circle" [class.selected]="challenge.level === 'EASY'"></div>
        <div class="lightning-group">
          <img src="assets/img/icon/difficulty-on.svg" alt="Difficulty" class="pink-bolt">
          <img src="assets/img/icon/difficulty-off.svg" alt="Difficulty" class="gray-bolt">
          <img src="assets/img/icon/difficulty-off.svg" alt="Difficulty" class="gray-bolt">
        </div>
        <span>Fácil</span>
      </label>
    </div>

    <!-- Medio -->
    <div class="difficulty-option">
      <input 
        type="radio" 
        class="form-check-input" 
        id="medium" 
        name="level" 
        value="MEDIUM"
        [(ngModel)]="challenge.level">
      <label class="difficulty-label" for="medium">
        <div class="radio-circle" [class.selected]="challenge.level === 'MEDIUM'"></div>
        <div class="lightning-group">
          <img src="assets/img/icon/difficulty-on.svg" alt="Difficulty" class="pink-bolt">
          <img src="assets/img/icon/difficulty-on.svg" alt="Difficulty" class="pink-bolt">
          <img src="assets/img/icon/difficulty-off.svg" alt="Difficulty" class="gray-bolt">
        </div>
        <span>Media</span>
      </label>
    </div>

    <!-- Difícil -->
    <div class="difficulty-option">
      <input 
        type="radio" 
        class="form-check-input" 
        id="hard" 
        name="level" 
        value="HARD"
        [(ngModel)]="challenge.level">
      <label class="difficulty-label" for="hard">
        <div class="radio-circle" [class.selected]="challenge.level === 'HARD'"></div>
        <div class="lightning-group">
          <img src="assets/img/icon/difficulty-on.svg" alt="Difficulty" class="pink-bolt">
          <img src="assets/img/icon/difficulty-on.svg" alt="Difficulty" class="pink-bolt">
          <img src="assets/img/icon/difficulty-on.svg" alt="Difficulty" class="pink-bolt">
        </div>
        <span>Difícil</span>
      </label>
    </div>
  </div>
</div>
        <!-- Solución con CodeMirror -->
        <div class="form-group mb-4">
          <label class="form-label">Solución</label>
          <div #codeMirrorEditor class="codemirror-container"></div>
        </div>

        <!-- Lenguaje -->
        <div class="mb-4">
          <label class="form-label">Lenguaje</label>
          <div class="language-buttons">
            @for (lang of languages; track lang.language_name) {
              <button 
                type="button" 
                class="btn btn-outline-secondary" 
                [class.active]="challenge.language === lang.language_name"
                (click)="onLanguageChange(lang.language_name)">
                {{ lang.language_name }}
              </button>
            }
          </div>
        </div>
        
        <!-- Botón Guardar -->
        <div class="text-end">
          <button type="submit" class="btn btn-primary" [disabled]="!challengeForm.form.valid">
            Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
