<div class="container mt-4">
  <div class="card">
    <div class="card-body">
      <h3>Nuevo reto</h3>

      <form #challengeForm="ngForm" (ngSubmit)="onSubmit()">
        <!-- Título -->
        <div class="mb-4">
          <label for="title" class="form-label">Título</label>
          <input type="text" class="form-control" id="title" name="challengeTitle"
            [(ngModel)]="challenge.challengeTitle" required>
        </div>

        <!-- Enunciado -->
        <div class="mb-4">
          <label for="description" class="form-label">Enunciado</label>
          <quill-editor class="custom-quill-editor large-editor" [(ngModel)]="challenge.description" name="description"
            id="description" [modules]="{
              toolbar: [
                ['bold', 'italic', 'underline'],
                [{ list: 'ordered' }, { list: 'bullet' }],
                [{ header: [1, 2, 3, false] }],
                [{ align: [] }]
              ]
            }"></quill-editor>
        </div>




        <!-- Dificultad -->
        <div class="mb-4">
          <label class="form-label d-block">Dificultad</label>
          <div class="difficulty-group">
            <div class="form-check form-check-inline">
              <input type="radio" class="form-check-input" id="easy" name="level" value="EASY"
                [(ngModel)]="challenge.level">
              <label class="form-check-label" for="easy">Iniciación</label>
            </div>
            <div class="form-check form-check-inline">
              <input type="radio" class="form-check-input" id="medium" name="level" value="MEDIUM"
                [(ngModel)]="challenge.level">
              <label class="form-check-label" for="medium">Intermedio</label>
            </div>
            <div class="form-check form-check-inline">
              <input type="radio" class="form-check-input" id="hard" name="level" value="HARD"
                [(ngModel)]="challenge.level">
              <label class="form-check-label" for="hard">Avanzado</label>
            </div>
          </div>
        </div>

        <!-- Solución -->
        <div class="mb-4">
          <label for="solution" class="form-label">Solución</label>
          <textarea class="form-control" id="solution" name="solution" rows="4" [(ngModel)]="challenge.solution"
            required></textarea>
        </div>

        <!-- Lenguaje -->
        <div class="mb-4">
          <label class="form-label">Especialización</label>
          <div class="language-buttons">
            <button type="button" class="btn btn-outline-secondary" [class.active]="challenge.language === 'Java'"
              (click)="challenge.language = 'Java'">
              Java
            </button>
            <button type="button" class="btn btn-outline-secondary" [class.active]="challenge.language === 'Javascript'"
              (click)="challenge.language = 'Javascript'">
              Javascript
            </button>
            <button type="button" class="btn btn-outline-secondary" [class.active]="challenge.language === 'Typescript'"
              (click)="challenge.language = 'Typescript'">
              Typescript
            </button>
            <button type="button" class="btn btn-outline-secondary" [class.active]="challenge.language === 'SQL'"
              (click)="challenge.language = 'SQL'">
              SQL
            </button>

            <button type="button" class="btn btn-outline-secondary" [class.active]="challenge.language === 'PHP'"
              (click)="challenge.language = 'PHP'">
              PHP
            </button>
            <button type="button" class="btn btn-outline-secondary" [class.active]="challenge.language === 'Python'"
              (click)="challenge.language = 'Python'">
              Python
            </button>
          </div>
        </div>

        <!-- Botón Guardar -->
        <div class="text-end">
          <button type="submit" class="btn btn-primary" [disabled]="!challengeForm.form.valid">
            Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
